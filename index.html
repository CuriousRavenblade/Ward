/* Layout: one true-black screen. The numbered task list flows top-down;
   the blue FAB sits alone at screen centre when empty and docks bottom-centre once tasks exist. */
:root{
  --black:#000000;
  --white:#FFFFFF;
  --white-2:rgba(255,255,255,.62);
  --white-3:rgba(255,255,255,.38);
  --blue-300:#64B5F6;
  --blue-500:#2196F3;
  --blue-900:#0D47A1;
  --blue-a200:#448AFF;
  --blue-a400:#2979FF;
  --blue-a700:#2962FF;
  --line:rgba(33,150,243,.34);
  --font:"Google Sans","Product Sans",Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.2,0,0,1);
  --fab:88px;
  --fab-hero:136px;
  --fab-gap:28px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--black);color:var(--white);
  font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--black);z-index:10}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--blue-a200);outline-offset:3px}

/* ---------- Page ---------- */
.wrap{max-width:640px;margin:0 auto;padding:0 4px calc(var(--fab) + var(--fab-gap) + 48px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--black);padding:22px 0 16px}
.date{font-size:14px;color:var(--white-2);letter-spacing:.01em}
.count{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.count-num{font-size:60px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count-label{font-size:20px;color:var(--white-2)}
.all-clear{margin:0;padding:18px 0;border-top:1px solid var(--line);font-size:16px;color:var(--white-2)}

/* ---------- Task rows ---------- */
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) 48px;align-items:start;column-gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.tasks.done .task{grid-template-columns:minmax(0,1fr) 48px}
.idx{font-size:15px;font-weight:500;line-height:24px;color:var(--blue-300);font-variant-numeric:tabular-nums}
.task-body{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;text-align:left;border-radius:6px}
.task-text{font-size:18px;line-height:24px;color:var(--white);overflow-wrap:anywhere;white-space:pre-wrap}
.task-time{font-size:13px;color:var(--white-2);font-variant-numeric:tabular-nums}
.tasks.done .task-text{color:var(--white-3);text-decoration:line-through;text-decoration-color:var(--white-3)}
.tasks.done .task-time{color:var(--white-3)}

/* Material checkbox, white */
.check{position:relative;justify-self:end;width:48px;height:48px;margin:-12px -14px -12px 0;display:grid;place-items:center;border-radius:50%;cursor:pointer}
.check::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--white);opacity:0;transition:opacity .15s}
.check:active::before{opacity:.14}
.check input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.box{position:relative;pointer-events:none;width:20px;height:20px;border:2px solid var(--white);border-radius:3px;display:grid;place-items:center;transition:background-color .15s var(--ease)}
.box svg{width:16px;height:16px;fill:none;stroke:var(--black);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .22s var(--ease) .04s}
.check input:checked + .box{background:var(--white)}
.check input:checked + .box svg{stroke-dashoffset:0}
.check input:focus-visible + .box{outline:2px solid var(--blue-a200);outline-offset:4px}

.task.entering{animation:enter .45s var(--ease)}
.task.leaving{animation:leave .3s var(--ease) forwards}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
@keyframes leave{to{opacity:0;transform:translateX(28px)}}

/* ---------- Done section ---------- */
.done-wrap{margin-top:36px}
.done-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:6px}
.done-title{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--white-2)}

/* ---------- Buttons ---------- */
.text-btn,.filled-btn{position:relative;overflow:hidden;height:40px;border-radius:20px;font-size:15px;font-weight:500;letter-spacing:.01em;transition:background-color .15s}
.text-btn{padding:0 14px;color:var(--blue-a200)}
.text-btn:active{background:rgba(68,138,255,.14)}
.filled-btn{padding:0 24px;background:var(--blue-a400);color:var(--white);box-shadow:0 4px 14px rgba(41,121,255,.35)}
.filled-btn:active{background:var(--blue-a700)}

/* ---------- The FAB ---------- */
.fab{
  position:fixed;z-index:20;left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--fab-gap));
  width:var(--fab);height:var(--fab);border-radius:50%;
  transform:translate(-50%,0);
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 34% 26%, var(--blue-a200) 0%, var(--blue-a400) 50%, var(--blue-a700) 100%);
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.32),
    inset 0 -10px 18px rgba(13,71,161,.55),
    0 6px 14px rgba(41,121,255,.40),
    0 18px 46px rgba(41,98,255,.34);
  transition:bottom .5s var(--ease),width .5s var(--ease),height .5s var(--ease),transform .5s var(--ease),scale .16s var(--ease),box-shadow .2s var(--ease);
}
.fab svg{width:46%;height:46%;fill:var(--white);filter:drop-shadow(0 2px 2px rgba(13,71,161,.65));pointer-events:none}
.fab:active{
  scale:.94;
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.26),
    inset 0 -8px 16px rgba(13,71,161,.6),
    0 3px 8px rgba(41,121,255,.36),
    0 8px 24px rgba(41,98,255,.26);
}
body.is-empty .fab{bottom:50%;transform:translate(-50%,50%);width:var(--fab-hero);height:var(--fab-hero)}
.empty-hint{display:none;position:fixed;left:0;right:0;top:calc(50% + var(--fab-hero) / 2 + 30px);margin:0;text-align:center;font-size:15px;color:var(--white-2);pointer-events:none}
body.is-empty .empty-hint{display:block;animation:fade .6s var(--ease) .2s backwards}

.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);pointer-events:none;animation:ripple .55s var(--ease) forwards}
.text-btn .ripple{background:rgba(68,138,255,.3)}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* ---------- Snackbar ---------- */
.snack{
  position:fixed;z-index:25;
  left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + var(--fab-gap) + var(--fab) + 18px);
  max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 6px 6px 18px;
  background:var(--black);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 10px 32px rgba(41,98,255,.24);
  font-size:15px;animation:rise .25s var(--ease);
}
.snack span{flex:1;min-width:0}

/* ---------- New / edit task window ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fade .2s var(--ease)}
.dialog{
  position:fixed;z-index:31;
  top:calc(env(safe-area-inset-top,0px) + 44px);
  left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));
  max-width:560px;margin:0 auto;padding:24px 20px 16px;
  background:var(--black);border:1px solid var(--line);border-radius:28px;
  box-shadow:0 0 0 1px rgba(13,71,161,.45),0 24px 64px rgba(41,98,255,.30);
  -webkit-user-select:text;user-select:text;
  animation:pop .3s var(--ease);
}
.dialog h2{margin:0 0 16px 4px;font-size:24px;font-weight:400;line-height:1.25}
.field{border:1px solid rgba(68,138,255,.55);border-radius:14px;padding:14px 16px;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--blue-a200);box-shadow:inset 0 0 0 1px var(--blue-a200)}
.field.shake{animation:shake .32s var(--ease)}
.field textarea{display:block;width:100%;min-height:27px;max-height:38vh;margin:0;padding:0;border:0;outline:0;resize:none;overflow-y:auto;background:transparent;color:var(--white);font:inherit;font-size:20px;line-height:27px;caret-color:var(--blue-a200)}
.field textarea::placeholder{color:var(--white-3)}
.hint{display:flex;align-items:center;gap:6px;margin:10px 4px 0;font-size:13px;color:var(--white-2)}
.hint svg{flex:none;width:16px;height:16px;fill:var(--blue-300)}
.actions{display:flex;align-items:center;gap:6px;margin-top:20px}
.actions .spacer{flex:1}
#delBtn{margin-left:-8px}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.96)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

body.booting *{transition:none!important}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="wrap" id="main" hidden>
  <header class="top">
    <div class="date" id="date"></div>
    <div class="count"><span class="count-num" id="countNum">0</span><span class="count-label">pending</span></div>
  </header>
  <p class="all-clear" id="allClear" hidden>Nothing pending.</p>
  <ol class="tasks" id="list" aria-label="Pending tasks"></ol>
  <section class="done-wrap" id="doneWrap" aria-label="Done" hidden>
    <div class="done-head">
      <span class="done-title">Done · <span id="doneCount">0</span></span>
      <button type="button" class="text-btn" id="clearDone">Clear</button>
    </div>
    <ol class="tasks done" id="doneList"></ol>
  </section>
</main>

<p class="empty-hint" aria-hidden="true">Tap to add a task</p>

<button type="button" class="fab" id="fab" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>

<div class="snack" id="snack" role="status" hidden><span id="snackMsg"></span><button type="button" class="text-btn" id="snackAction">Undo</button></div>

<div class="scrim" id="scrim" hidden></div>
<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden>
  <h2 id="dlgTitle">New task</h2>
  <div class="field" id="field">
    <textarea id="taskInput" rows="1" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" autocorrect="on" spellcheck="true" placeholder="e.g. Bed 12 · repeat CBC" aria-label="Task"></textarea>
  </div>
  <p class="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>Tap the mic on your keyboard to dictate</p>
  <div class="actions">
    <button type="button" class="text-btn" id="delBtn" hidden>Delete</button>
    <span class="spacer"></span>
    <button type="button" class="text-btn" id="cancelBtn">Cancel</button>
    <button type="button" class="filled-btn" id="saveBtn">Add</button>
  </div>
</div>

<script>window.__WARD_HOSTED__ = true;</script>
<script>
(function () {
  'use strict';
  var KEY = 'wardTasks.v1';
  var $ = function (id) { return document.getElementById(id); };
  var input = $('taskInput');
  var motion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  var tasks = load();
  var editingId = null;
  var draft = '';
  var undoFn = null;
  var snackTimer = 0;

  /* ---------- storage (stays on this phone only) ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      var v = raw ? JSON.parse(raw) : [];
      return Array.isArray(v) ? v.filter(function (t) { return t && typeof t.text === 'string' && t.id; }) : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------- helpers ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function dayKey(d) { return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
  function fmtTime(ms) {
    var d = new Date(ms), now = new Date();
    var t = d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
    if (dayKey(d) === dayKey(now)) return t;
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (dayKey(d) === dayKey(y)) return 'Yesterday, ' + t;
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) + ', ' + t;
  }
  function find(id) { for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) return tasks[i]; return null; }

  var CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function row(t, n) {
    var li = document.createElement('li');
    li.className = 'task';
    li.dataset.id = t.id;
    if (n) {
      var idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = n;
      li.appendChild(idx);
    }
    var body = document.createElement('button');
    body.type = 'button';
    body.className = 'task-body';
    var tx = document.createElement('span');
    tx.className = 'task-text';
    tx.textContent = t.text;
    var tm = document.createElement('span');
    tm.className = 'task-time';
    tm.textContent = t.done ? 'Done ' + fmtTime(t.doneAt || t.created) : fmtTime(t.created);
    body.appendChild(tx);
    body.appendChild(tm);
    var lab = document.createElement('label');
    lab.className = 'check';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!t.done;
    cb.setAttribute('aria-label', (t.done ? 'Mark not done: ' : 'Mark done: ') + t.text);
    var box = document.createElement('span');
    box.className = 'box';
    box.innerHTML = CHECK;
    lab.appendChild(cb);
    lab.appendChild(box);
    li.appendChild(body);
    li.appendChild(lab);
    return li;
  }

  /* ---------- render ---------- */
  function render(newId) {
    var pending = tasks.filter(function (t) { return !t.done; });
    var done = tasks.filter(function (t) { return t.done; })
      .sort(function (a, b) { return (b.doneAt || 0) - (a.doneAt || 0); });

    document.body.classList.toggle('is-empty', tasks.length === 0);
    $('main').hidden = tasks.length === 0;
    $('date').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' });
    $('countNum').textContent = pending.length;

    var list = $('list');
    list.textContent = '';
    pending.forEach(function (t, i) {
      var r = row(t, i + 1);
      if (t.id === newId) r.classList.add('entering');
      list.appendChild(r);
    });
    list.hidden = pending.length === 0;
    $('allClear').hidden = pending.length !== 0;

    var dl = $('doneList');
    dl.textContent = '';
    done.forEach(function (t) { dl.appendChild(row(t, 0)); });
    $('doneWrap').hidden = done.length === 0;
    $('doneCount').textContent = done.length;
  }

  /* ---------- task window ---------- */
  function grow() {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  }
  function openDialog(id) {
    var t = id ? find(id) : null;
    editingId = t ? t.id : null;
    $('dlgTitle').textContent = t ? 'Edit task' : 'New task';
    $('saveBtn').textContent = t ? 'Save' : 'Add';
    $('delBtn').hidden = !t;
    input.value = t ? t.text : draft;
    $('scrim').hidden = false;
    $('dialog').hidden = false;
    document.body.classList.add('modal-open');
    hideSnack();
    // Focus inside the tap itself so iOS raises the keyboard straight away.
    try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
    grow();
    var L = input.value.length;
    try { input.setSelectionRange(L, L); } catch (e) {}
  }
  function closeDialog(keepDraft) {
    if (!editingId) draft = keepDraft ? input.value : '';
    input.blur();
    $('scrim').hidden = true;
    $('dialog').hidden = true;
    document.body.classList.remove('modal-open');
    editingId = null;
  }
  function submit() {
    var text = input.value.replace(/^\s+|\s+$/g, '');
    if (!text) {
      var f = $('field');
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      input.focus();
      return;
    }
    var newId = null;
    if (editingId) {
      var t = find(editingId);
      if (t) t.text = text;
    } else {
      newId = uid();
      tasks.push({ id: newId, text: text, created: Date.now(), done: false, doneAt: null });
    }
    save();
    input.value = '';
    closeDialog(false);
    render(newId);
    if (newId) {
      requestAnimationFrame(function () {
        var el = document.querySelector('[data-id="' + newId + '"]');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: motion.matches ? 'auto' : 'smooth' });
      });
    }
  }

  /* ---------- snackbar ---------- */
  function snack(msg, undo) {
    clearTimeout(snackTimer);
    $('snackMsg').textContent = msg;
    undoFn = undo;
    $('snack').hidden = false;
    snackTimer = setTimeout(hideSnack, 6000);
  }
  function hideSnack() {
    clearTimeout(snackTimer);
    $('snack').hidden = true;
    undoFn = null;
  }

  /* ---------- events ---------- */
  $('fab').addEventListener('click', function () { openDialog(null); });
  $('cancelBtn').addEventListener('click', function () { closeDialog(true); });
  $('scrim').addEventListener('click', function () { closeDialog(true); });
  $('saveBtn').addEventListener('click', submit);
  input.addEventListener('input', grow);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeDialog(true); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('dialog').hidden) closeDialog(true);
  });

  $('delBtn').addEventListener('click', function () {
    var i = -1;
    for (var k = 0; k < tasks.length; k++) if (tasks[k].id === editingId) i = k;
    if (i < 0) return;
    var removed = tasks.splice(i, 1)[0];
    save();
    closeDialog(false);
    render();
    snack('Task deleted', function () { tasks.splice(i, 0, removed); save(); render(); });
  });

  $('clearDone').addEventListener('click', function () {
    var before = tasks.slice();
    var n = tasks.filter(function (t) { return t.done; }).length;
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
    snack('Cleared ' + n + ' done', function () { tasks = before; save(); render(); });
  });

  $('snackAction').addEventListener('click', function () {
    var f = undoFn;
    hideSnack();
    if (f) f();
  });

  $('main').addEventListener('change', function (e) {
    var cb = e.target;
    if (!cb || cb.type !== 'checkbox') return;
    var li = cb.closest('.task');
    var t = li && find(li.dataset.id);
    if (!t) return;
    t.done = cb.checked;
    t.doneAt = cb.checked ? Date.now() : null;
    save();
    if (cb.checked && !motion.matches) {
      li.classList.add('leaving');
      setTimeout(function () { render(); }, 300);
    } else {
      render();
    }
  });

  $('main').addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.task-body');
    if (b) openDialog(b.parentNode.dataset.id);
  });

  // Material ripple on the FAB and buttons
  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest && e.target.closest('.fab, .text-btn, .filled-btn');
    if (!el || motion.matches) return;
    var r = el.getBoundingClientRect();
    var d = Math.max(r.width, r.height) * 2.2;
    var s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (e.clientX - r.left - d / 2) + 'px';
    s.style.top = (e.clientY - r.top - d / 2) + 'px';
    el.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 650);
  });

  // Refresh the date and times when the app comes back to the front
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && $('dialog').hidden) { tasks = load(); render(); }
  });

  /* ---------- boot ---------- */
  document.body.classList.add('booting');
  render();
  requestAnimationFrame(function () { requestAnimationFrame(function () { document.body.classList.remove('booting'); }); });

  if (window.__WARD_HOSTED__ && 'serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
